# Full-stack Docker deployment: Express serves the built React frontend and API.
# The free plan is suitable for demos and spins down after inactivity.

services:
  - type: web
    name: creative-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.8-flash
      - key: OPENAI_API_KEY
        sync: false
